<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - FTI HC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@0.2.2/dist/basecoat.min.css"/>
  <style>
    body { background: #f5f5f5; font-family: sans-serif; }
    .navbar { background: #111; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .navbar h1 { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .navbar span { font-size: 0.85rem; color: #aaa; }
    .btn-logout { background: transparent; border: 1px solid #555; color: white; padding: 0.3rem 0.8rem; border-radius: 5px; cursor: pointer; font-size: 0.85rem; }
    .btn-logout:hover { background: #333; }
    .container { max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; overflow: hidden; }
    .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid #eee; }
    .card-header h2 { margin: 0; font-size: 1rem; font-weight: 600; }
    .card-header p { margin: 0.2rem 0 0; font-size: 0.82rem; color: #888; }
    .card-body { padding: 1.5rem; }
    .avatar-area { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.5rem; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: #111; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; }
    .avatar-info h3 { margin: 0; font-size: 1rem; font-weight: 600; }
    .avatar-info span { font-size: 0.82rem; color: #888; }
    .badge { display: inline-block; background: #f0f0f0; color: #333; padding: 0.15rem 0.6rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; margin-top: 0.3rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-weight: 500; font-size: 0.875rem; margin-bottom: 0.35rem; }
    .form-group input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: #111; }
    .btn { padding: 0.5rem 1.2rem; border-radius: 6px; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: #111; color: white; }
    .btn-primary:hover { background: #333; }
    .btn-outline { background: white; color: #111; border: 1px solid #ddd; }
    .btn-outline:hover { background: #f5f5f5; }
    .alert { padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.82rem; margin-bottom: 1rem; display: none; }
    .alert-success { background: #dcfce7; color: #166534; }
    .alert-error { background: #fee2e2; color: #b91c1c; }
    .divider { border: none; border-top: 1px solid #eee; margin: 1rem 0; }
    .info-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.875rem; }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: #888; }
    .info-row .value { font-weight: 500; }
  </style>
</head>
<body>

<nav class="navbar">
  <h1>FTI HC - Sistem Kepegawaian</h1>
  <div style="display:flex;align-items:center;gap:1rem;">
    <span id="navName">Loading...</span>
    <button class="btn-logout" onclick="logout()">Keluar</button>
  </div>
</nav>

<div class="container">

  <!-- Portofolio / Info Profile -->
  <div class="card">
    <div class="card-header">
      <h2>Portofolio Pribadi</h2>
      <p>Informasi akun dan data pegawai</p>
    </div>
    <div class="card-body">
      <div class="avatar-area">
        <div class="avatar" id="avatarInitial">?</div>
        <div class="avatar-info">
          <h3 id="profileName">-</h3>
          <span id="profileEmail">-</span><br/>
          <span class="badge" id="profileRole">-</span>
        </div>
      </div>
      <div id="infoRows"></div>
    </div>
  </div>

  <!-- Edit Profile -->
  <div class="card">
    <div class="card-header">
      <h2>Edit Profile</h2>
      <p>Update nama dan email akun Anda</p>
    </div>
    <div class="card-body">
      <div class="alert alert-success" id="editSuccess"></div>
      <div class="alert alert-error" id="editError"></div>
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="editName" placeholder="Nama lengkap"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="editEmail" placeholder="email@example.com"/>
      </div>
      <button class="btn btn-primary" onclick="updateProfile()">Simpan Perubahan</button>
    </div>
  </div>

  <!-- Ganti Password -->
  <div class="card">
    <div class="card-header">
      <h2>Ganti Password</h2>
      <p>Pastikan password baru minimal 8 karakter</p>
    </div>
    <div class="card-body">
      <div class="alert alert-success" id="passSuccess"></div>
      <div class="alert alert-error" id="passError"></div>
      <div class="form-group">
        <label>Password Lama</label>
        <input type="password" id="currentPass" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label>Password Baru</label>
        <input type="password" id="newPass" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label>Konfirmasi Password Baru</label>
        <input type="password" id="confirmPass" placeholder="••••••••"/>
      </div>
      <button class="btn btn-primary" onclick="updatePassword()">Ubah Password</button>
    </div>
  </div>

</div>

<script>
  // Load profile saat halaman dibuka
  async function loadProfile() {
    const res = await fetch('/api/profile');
    const data = await res.json();
    if (!data.success) return;

    const user = data.data;
    const initial = user.name ? user.name[0].toUpperCase() : '?';

    document.getElementById('avatarInitial').textContent = initial;
    document.getElementById('navName').textContent = user.name;
    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('profileRole').textContent = user.roles.join(', ') || 'Pegawai';

    document.getElementById('editName').value = user.name;
    document.getElementById('editEmail').value = user.email;

    const joinDate = new Date(user.created_at).toLocaleDateString('id-ID', {
      year: 'numeric', month: 'long', day: 'numeric'
    });

    document.getElementById('infoRows').innerHTML = `
      <div class="info-row"><span class="label">ID Pengguna</span><span class="value">#${user.id}</span></div>
      <div class="info-row"><span class="label">Email</span><span class="value">${user.email}</span></div>
      <div class="info-row"><span class="label">Role</span><span class="value">${user.roles.join(', ') || '-'}</span></div>
      <div class="info-row"><span class="label">Bergabung</span><span class="value">${joinDate}</span></div>
    `;
  }

  async function updateProfile() {
    const name = document.getElementById('editName').value;
    const email = document.getElementById('editEmail').value;
    const success = document.getElementById('editSuccess');
    const error = document.getElementById('editError');

    success.style.display = 'none';
    error.style.display = 'none';

    const res = await fetch('/api/profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email }),
    });
    const data = await res.json();

    if (data.success) {
      success.style.display = 'block';
      success.textContent = data.message;
      loadProfile();
    } else {
      error.style.display = 'block';
      error.textContent = data.message;
    }
  }

  async function updatePassword() {
    const current_password = document.getElementById('currentPass').value;
    const new_password = document.getElementById('newPass').value;
    const confirm_password = document.getElementById('confirmPass').value;
    const success = document.getElementById('passSuccess');
    const error = document.getElementById('passError');

    success.style.display = 'none';
    error.style.display = 'none';

    const res = await fetch('/api/profile/password', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current_password, new_password, confirm_password }),
    });
    const data = await res.json();

    if (data.success) {
      success.style.display = 'block';
      success.textContent = data.message;
      document.getElementById('currentPass').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('confirmPass').value = '';
    } else {
      error.style.display = 'block';
      error.textContent = data.message;
    }
  }

  async function logout() {
    await fetch('/auth/logout', { method: 'POST' });
    window.location.href = '/auth/login';
  }

  loadProfile();
</script>
</body>
</html>
